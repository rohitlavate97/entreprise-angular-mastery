name: Enterprise Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. Angular Frontend Validation & Build Job
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-app/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: projects/enterprise-app/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Strict AOT Production Build & Budget Check
        run: npm run build -- --configuration production

  # -------------------------------------------------------------
  # 2. Spring Boot Backend Test & Package Job
  # -------------------------------------------------------------
  backend-build:
    name: Backend Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-app/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Execute Tests & Maven Package
        run: mvn clean test package -B

  # -------------------------------------------------------------
  # 3. Multi-Stage Docker Container Verification Job
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Multi-Stage Image Validation
    needs: [ frontend-build, backend-build ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/enterprise-app/frontend
          file: ./projects/enterprise-app/frontend/Dockerfile
          push: false
          tags: enterprise-frontend:ci-test

      - name: Build Spring Boot Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/enterprise-app/backend
          file: ./projects/enterprise-app/backend/Dockerfile
          push: false
          tags: enterprise-backend:ci-test
